name: ci

# Frontend gate: typecheck + production build on every push to main and every
# PR. Vercel deploys main independently — this is the safety net that turns a
# broken push red within a couple of minutes.
#
# The test/mutation/python jobs below were added with the test harness: they run
# the unit + property + data-integrity suites, enforce coverage + mutation-score
# gates on the game logic core, and run the offline scraper tests.

on:
  push:
    branches: [main]
  pull_request: {}
  # Manual re-run. GitHub occasionally drops a `synchronize` event and the
  # push simply never gets a check suite — without this there is no way to
  # ask for one short of pushing an empty commit.
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  frontend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install deps
        run: npm ci
      - name: Unit + property + data-integrity (with coverage gate)
        run: npm run test:cov

      # A missing translation key is not a test failure — it is a player
      # seeing a raw key, or Russian, in the middle of their own language.
      # CLAUDE.md has said "check before opening a PR" since the nine locales
      # landed, and a check that depends on remembering is not a check.
      # Offline, no network, exits 1 on a real gap.
      - name: Translations complete in all nine locales
        run: node scripts/check-i18n.mjs

  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install deps
        run: npm ci
      - name: Mutation testing (StrykerJS, game-logic core)
        run: npm run test:mutation
      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stryker-report
          path: reports/mutation/
          if-no-files-found: ignore

  # The voice server, checked from outside — preflight headers, the 400/401
  # shapes that prove the HMAC check is live, and which providers this
  # deployment can actually sign for.
  #
  # IT NEEDS A LIVE DEPLOYMENT TO TALK TO, so it runs only where one has been
  # configured, and is SKIPPED otherwise. That distinction is the whole point:
  # check-voice.mjs exits 0 when it has no URL, so a job that ran it
  # unconditionally would report success without having checked anything —
  # which is the exact defect the python job was carrying (see its comment).
  # A skipped job says "not checked"; a green one would have lied.
  #
  # To turn it on: repository variable SUPABASE_URL, repository secret
  # SUPABASE_ANON_KEY. The anon key is public by design — it is in the client
  # bundle already — and no server secret is involved.
  voice-check:
    if: ${{ vars.SUPABASE_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Voice server reachable, signing, and refusing forged sessions
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: node scripts/check-voice.mjs

  python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: football_scraper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install -r requirements.txt
      # Only test_property_canonical.py is a pytest suite — the rest are
      # standalone scripts pytest collects nothing from.
      - name: Pytest (offline property suite)
        run: python -m pytest -q

      # The other scraper tests print ok/FAIL and exit 1, so pytest walks past
      # them and this job went green while any of them could be failing. Run
      # them the way they are meant to be run, and fail the job if any does.
      - name: Standalone scraper tests
        run: |
          failed=""
          for f in tests/test_*.py; do
            echo "::group::$f"
            python "$f" || failed="$failed $f"
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "Failed:$failed"
            exit 1
          fi
