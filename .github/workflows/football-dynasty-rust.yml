name: Football Dynasty Rust

on:
  pull_request:
    paths:
      - "services/football-dynasty/**"
      - "services/sherlock-core/**"
      - "docs/football-dynasty/**"
      - "docs/MAP.md"
      - "supabase/migrations/20261110100000_football_dynasty_owner_rls.sql"
      - "supabase/migrations/20261110103000_football_dynasty_rls_initplan.sql"
      - "supabase/tests/football_dynasty_owner_rls.test.sql"
      - ".github/workflows/football-dynasty-rust.yml"
  push:
    branches: [main]
    paths:
      - "services/football-dynasty/**"
      - "services/sherlock-core/**"
      - ".github/workflows/football-dynasty-rust.yml"

permissions:
  contents: read

concurrency:
  group: football-dynasty-rust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: football_dynasty_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d football_dynasty_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/football_dynasty_test
    defaults:
      run:
        working-directory: services/football-dynasty
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Run tests
        run: cargo test --all-targets
      - name: Check Sherlock core formatting
        working-directory: services/sherlock-core
        run: cargo fmt --all -- --check
      - name: Run Sherlock core Clippy
        working-directory: services/sherlock-core
        run: cargo clippy --all-targets -- -D warnings
      - name: Run Sherlock core tests
        working-directory: services/sherlock-core
        run: cargo test --all-targets
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
      - name: Apply Football Dynasty schema and owner-scoped RLS
        run: |
          RLS_DATABASE_URL="postgres://postgres:postgres@localhost:5432/football_dynasty_rls_test"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "CREATE DATABASE football_dynasty_rls_test"
          psql "$RLS_DATABASE_URL" -v ON_ERROR_STOP=1 -c "CREATE ROLE anon NOLOGIN; CREATE ROLE authenticated NOLOGIN"
          psql "$RLS_DATABASE_URL" -v ON_ERROR_STOP=1 -f ../../supabase/migrations/20261105203942_football_dynasty_foundation.sql
          psql "$RLS_DATABASE_URL" -v ON_ERROR_STOP=1 -f ../../supabase/migrations/20261105204011_football_dynasty_rls_hardening.sql
          psql "$RLS_DATABASE_URL" -v ON_ERROR_STOP=1 -f ../../supabase/migrations/20261110100000_football_dynasty_owner_rls.sql
          psql "$RLS_DATABASE_URL" -v ON_ERROR_STOP=1 -f ../../supabase/migrations/20261110103000_football_dynasty_rls_initplan.sql
          psql "$RLS_DATABASE_URL" -v ON_ERROR_STOP=1 -f ../../supabase/tests/football_dynasty_rls.test.sql
          psql "$RLS_DATABASE_URL" -v ON_ERROR_STOP=1 -f ../../supabase/tests/football_dynasty_owner_rls.test.sql
      - name: Export resolved dependency lockfile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: football-dynasty-cargo-lock
          path: services/football-dynasty/Cargo.lock
          if-no-files-found: warn
