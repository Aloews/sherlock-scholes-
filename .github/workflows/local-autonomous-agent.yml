name: Local autonomous coding agent

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: read

concurrency:
  group: local-ai-agent-\${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  code:
    if: >-
      github.event.issue.pull_request == null &&
      github.event.comment.user.login == github.repository_owner &&
      startsWith(github.event.comment.body, '/ai ')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: \${{ github.event.repository.default_branch }}

      - name: Install local model runtime
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://ollama.com/install.sh | sh
          (ollama serve > /tmp/ollama.log 2>&1 &) 
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then
              break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:11434/api/tags >/dev/null
          ollama pull qwen2.5-coder:3b

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate patch with local model
        env:
          GITHUB_EVENT_PATH: \${{ github.event_path }}
          GITHUB_REPOSITORY: \${{ github.repository }}
        run: python .github/scripts/local_model_agent.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Translation check
        run: node scripts/check-i18n.mjs

      - name: Open pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: \${{ secrets.GITHUB_TOKEN }}
          branch: ai/issue-\${{ github.event.issue.number }}-\${{ github.run_id }}
          delete-branch: true
          title: "AI implementation for issue #\${{ github.event.issue.number }}"
          body: |
            Generated by the local Qwen2.5-Coder model running on a GitHub-hosted runner.
            
            Original task: \${{ github.event.comment.html_url }}
            
            The workflow ran typecheck, production build, unit tests, and translation validation before opening this PR. Review the diff and checks before merging.
