name: Local autonomous coding agent

"on":
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: read

concurrency:
  group: local-ai-agent-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  code:
    if: >-
      github.event.issue.pull_request == null &&
      github.event.comment.user.login == github.repository_owner &&
      startsWith(github.event.comment.body, '/ai ')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Install pinned Caveman 4.1.0 skill
        shell: bash
        run: |
          set -euo pipefail
          CAVEMAN_DIR="$RUNNER_TEMP/caveman"
          git clone --depth 1 --branch v4.1.0 https://github.com/JuliusBrussee/caveman.git "$CAVEMAN_DIR"
          test "$(git -C "$CAVEMAN_DIR" rev-parse HEAD)" = "1e91f1306d602d4ca23618701b1185575ae1869b"
          test -s "$CAVEMAN_DIR/skills/caveman/SKILL.md"
          echo "CAVEMAN_SKILL_PATH=$CAVEMAN_DIR/skills/caveman/SKILL.md" >> "$GITHUB_ENV"

      - name: Index repository with codebase-memory-mcp
        shell: bash
        run: |
          set -euo pipefail
          if npx --yes codebase-memory-mcp@0.12.1 cli --quiet index_repository --repo-path "$GITHUB_WORKSPACE" >/tmp/cbm-index.json; then
            if npx --yes codebase-memory-mcp@0.12.1 cli --quiet list_projects --format json >/tmp/cbm-projects.json; then
              PROJECT="$(jq -r '.projects[0].name // empty' /tmp/cbm-projects.json)"
              if [[ -n "$PROJECT" ]]; then
                echo "CBM_PROJECT=$PROJECT" >> "$GITHUB_ENV"
                echo "Indexed code graph: $PROJECT"
              else
                echo "::warning::No codebase-memory project name found; using bounded file context."
              fi
            else
              echo "::warning::Could not list codebase-memory projects; using bounded file context."
            fi
          else
            echo "::warning::codebase-memory-mcp indexing failed; using bounded file context."
          fi

      - name: Install local model runtime
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://ollama.com/install.sh | sh
          (ollama serve > /tmp/ollama.log 2>&1 &) 
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then
              break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:11434/api/tags >/dev/null
          ollama pull qwen2.5-coder:3b
          ollama show qwen2.5-coder:3b >/dev/null
          echo "Verified local model: qwen2.5-coder:3b"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test agent network and patch safety
        run: |
          python -m py_compile .github/scripts/local_model_agent.py .github/scripts/agent_network.py .github/scripts/quality_gate.py .github/scripts/fable_ci_repair.py
          python .github/scripts/test_local_model_agent.py
          python .github/scripts/test_agent_network.py

      - name: Run Qwen multi-role network
        env:
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python .github/scripts/agent_network.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Run deterministic quality gates
        id: quality
        continue-on-error: true
        run: python .github/scripts/quality_gate.py

      - name: Escalate failed quality gates to Fable 5.2
        if: steps.quality.outcome == 'failure'
        env:
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          STARIMG_API_KEY: ${{ secrets.STARIMG_API_KEY }}
          STARIMG_MODEL: claude-fable-5-2
          STARIMG_BASE_URL: https://ai.starimg.ru
        run: python .github/scripts/fable_ci_repair.py

      - name: Open pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: ai/issue-${{ github.event.issue.number }}-${{ github.run_id }}
          delete-branch: true
          title: "AI implementation for issue #${{ github.event.issue.number }}"
          body: |
            Generated by the local Qwen2.5-Coder model running on a GitHub-hosted runner.
            
            Original task: ${{ github.event.comment.html_url }}
            
            The workflow ran typecheck, production build, unit tests, and translation validation before opening this PR. Review the diff and checks before merging.
