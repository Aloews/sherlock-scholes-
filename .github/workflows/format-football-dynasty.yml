name: Format Football Dynasty Rust

on:
  push:
    branches:
      - fix/fd-rustfmt-20261119

permissions:
  contents: write

concurrency:
  group: fd-rustfmt-main
  cancel-in-progress: false

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Install Rust formatter
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format Football Dynasty Rust sources
        run: cargo fmt --manifest-path services/football-dynasty/Cargo.toml
      - name: Verify formatting
        run: cargo fmt --manifest-path services/football-dynasty/Cargo.toml -- --check
      - name: Commit formatting-only changes to main
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/football-dynasty
          git commit -m "style(dynasty): apply rustfmt"
          git push origin HEAD:main
