name: cards-descriptions

# Manual, controlled batches of cards.descriptions (docs/cards_descriptions_build.py):
# a card gets a short blurb from its Wikipedia lead.
#
# ⚠️ ИГРОКИ ТЕПЕРЬ ВХОДЯТ В ОБЛАСТЬ ДЕЙСТВИЯ, и их много: 2918 активных
# карточек с НУЛЁМ описаний против 92–100% у остальных категорий. Гонять их
# одной пачкой не стоит — бюджет Wikimedia общий с ночным daily-enrich.
# Разумный порядок: сначала dry-run с limit=20 и categories=player, глазами
# посмотреть таблицу BEFORE/AFTER в логе, и только потом apply=true.
#
# DRY-RUN BY DEFAULT — the run prints a BEFORE/AFTER table and writes nothing,
# so a batch can be reviewed in the log before it lands. Re-run with
# apply=true to write it. The nightly daily-enrich workflow runs the same
# script with a small limit; this one is for eyeballing and for backfilling a
# specific category faster than the nightly ramp.
#
# The Wikimedia budget + scrape caches are shared with daily-enrich through
# the same actions/cache key, so batches here spend the same daily allowance.

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'How many cards (0 = all remaining)'
        required: true
        default: '5'
      categories:
        description: 'Comma-separated categories (empty = all in scope, players included)'
        required: false
        default: ''
      apply:
        description: 'Write to the DB (unchecked = dry-run)'
        type: boolean
        required: true
        default: false

# Shares the budget/cache with the nightly run — never overlap with it.
concurrency:
  group: daily-enrich
  cancel-in-progress: false

jobs:
  descriptions:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}   # service_role — repo secret
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: football_scraper/requirements.txt

      - name: Install deps
        run: pip install -r football_scraper/requirements.txt

      # Same cache key scheme as daily-enrich: the Wikimedia budget counter and
      # the resolved-title/lead caches carry over between runs.
      - name: Restore scraper cache
        uses: actions/cache@v4
        with:
          path: football_scraper/cache
          key: scraper-cache-${{ github.run_id }}
          restore-keys: |
            scraper-cache-

      # Guards + blurb shaping are pure functions — verify them before the run
      # touches the network or the DB.
      - name: Offline tests (blurb shaping + guards)
        run: python football_scraper/tests/test_descriptions.py

      - name: Build descriptions
        env:
          APPLY: ${{ inputs.apply && '1' || '0' }}
        run: |
          python docs/cards_descriptions_build.py \
            --limit "${{ inputs.limit }}" \
            ${{ inputs.categories && format('--categories {0}', inputs.categories) || '' }}
