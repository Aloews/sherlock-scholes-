name: Qwen agent network

on:
  workflow_dispatch:
    inputs:
      task:
        description: Bounded engineering task
        required: true
        type: string
      base_ref:
        description: Existing branch to work from
        required: true
        default: main
        type: string
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: read

concurrency:
  group: qwen-agent-${{ github.event.issue.number || github.event.inputs.base_ref || github.ref }}
  cancel-in-progress: false

jobs:
  qwen:
    if: github.actor == github.repository_owner && (github.event_name == 'workflow_dispatch' || (github.event.issue.pull_request == null && startsWith(github.event.comment.body, '/ai ')))
    runs-on: ubuntu-latest
    timeout-minutes: 50
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aurel_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d aurel_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_ADMIN_URL: postgres://postgres:postgres@localhost:5432/aurel_test
      TEST_DATABASE_URL: postgres://aurel_app:aurel_test_password@localhost:5432/aurel_test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.inputs.base_ref || github.event.repository.default_branch }}
          persist-credentials: false
      - name: Install Ollama and Qwen
        run: |
          set -euo pipefail
          curl -fsSL https://ollama.com/install.sh | sh
          (ollama serve >/tmp/ollama.log 2>&1 &) 
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:11434/api/tags >/dev/null
          ollama pull qwen2.5-coder:3b
      - name: Run planner, implementer and reviewer
        id: agent
        env:
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: python3 .github/scripts/qwen_agent_network.py
      - name: Rust toolchain
        if: hashFiles('Cargo.toml') != ''
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Rust checks
        if: hashFiles('Cargo.toml') != ''
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
          cargo build --release --workspace
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        if: hashFiles('package-lock.json') != ''
        with:
          node-version: 24
          cache: npm
      - name: Node checks
        if: hashFiles('package-lock.json') != ''
        run: |
          npm ci
          npm audit --audit-level=high
          npm test --if-present
          npm run lint --if-present
          npm run build
      - name: Open review PR
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: ai/qwen-${{ github.run_id }}
          base: ${{ steps.agent.outputs.base_branch }}
          delete-branch: true
          title: AI implementation by Qwen agent network
          body: |
            Generated by the local Qwen2.5-Coder 3B network.
            Roles: planner, implementer, independent reviewer.
            Rust and Node checks ran before this PR was opened.
            No automatic merge or deployment is performed.
