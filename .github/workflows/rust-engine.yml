name: rust-engine

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "services/football-dynasty/**"
      - "supabase/migrations/**"
      - ".github/workflows/rust-engine.yml"
  push:
    branches: [main, feat/dynasty-rust-engine-core-20261119, feat/dynasty-squad-inspection-20261127]
    paths:
      - "services/football-dynasty/**"
      - ".github/workflows/rust-engine.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: football_dynasty_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d football_dynasty_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/football_dynasty_test
    defaults:
      run:
        working-directory: services/football-dynasty
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply complete PostgreSQL migration chain
        run: |
          for migration in migrations/*.sql; do
            echo "Applying $migration"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$migration"
          done
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/living_world_postgres.sql
      - name: Verify service and Supabase migration parity
        run: cmp migrations/0011_match_rosters_events.sql ../../supabase/migrations/20261119160000_football_dynasty_match_engine.sql
      - name: Verify spatial migration parity
        run: cmp migrations/0012_match_spatial_events.sql ../../supabase/migrations/20261120170000_football_dynasty_spatial_events.sql
      - name: Verify living world migration parity
        run: cmp migrations/0013_living_world_core.sql ../../supabase/migrations/20261121160000_football_dynasty_living_world.sql
      - name: Verify fixture lineup formation migration parity
        run: cmp migrations/0014_fixture_lineup_formation.sql ../../supabase/migrations/20261127130000_football_dynasty_fixture_lineup_formation.sql
      - name: Verify player training migration parity
        run: cmp migrations/0015_player_training_development.sql ../../supabase/migrations/20261127140000_football_dynasty_player_training_development.sql
      - name: Reset PostgreSQL after migration smoke tests
        run: |
          psql "postgres://postgres:postgres@localhost:5432/postgres" -v ON_ERROR_STOP=1 -c "SELECT pg_terminate_backend(pid) FROM pg_stat_activity WHERE datname='football_dynasty_test' AND pid <> pg_backend_pid();"
          psql "postgres://postgres:postgres@localhost:5432/postgres" -v ON_ERROR_STOP=1 -c "DROP DATABASE football_dynasty_test;"
          psql "postgres://postgres:postgres@localhost:5432/postgres" -v ON_ERROR_STOP=1 -c "CREATE DATABASE football_dynasty_test;"
      - name: Run Clippy with warnings denied
        run: cargo clippy --all-targets -- -D warnings
      - name: Compile and test engine and API
        run: cargo test --all-targets
      - name: Compile release binary
        run: cargo build --release
