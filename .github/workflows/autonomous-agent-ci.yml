name: Autonomous engineering worker

on:
  pull_request:
    paths:
      - "services/autonomous-agent/**"
      - ".github/workflows/autonomous-agent-ci.yml"
  push:
    branches: [main]
    paths:
      - "services/autonomous-agent/**"
      - ".github/workflows/autonomous-agent-ci.yml"

permissions:
  contents: read

jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile and test worker policy
        working-directory: services/autonomous-agent
        run: |
          python -m py_compile worker.py test_worker.py
          python -m unittest -v
      - name: Build worker container
        run: docker build -f services/autonomous-agent/Dockerfile services/autonomous-agent
