name: player-stats-sql-regression

on:
  pull_request:
  push:
    branches: [main, fix/player-stats-cache-and-nightly-verify]
  workflow_dispatch:

jobs:
  sql-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sherlock_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sherlock_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: sherlock_test
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
      - name: Create disposable test schema
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/player_rating_cache_test_setup.sql
      - name: Apply rating-cache migrations
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261009190000_fix_player_rating_cache_and_card_verification.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261012080000_player_rating_cache_per_card_fallback.sql
      - name: Run SQL regression assertions
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/player_rating_cache_refresh.test.sql

      - name: Apply exact-card Smart Deck migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261012120000_smart_deck_card_ids.sql

      - name: Smart Deck exact-card regression
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/smart_deck_card_ids.test.sql

      - name: Apply private Smart Deck editorial cache migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261012130000_smart_deck_editorial_cache.sql

      - name: Smart Deck cache permissions regression
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/smart_deck_editorial_cache.test.sql

      - name: Apply presence and stats RPC hardening
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261012111500_presence_stats_hardening.sql

      - name: Presence and stats RPC privilege regression
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/presence_stats_hardening.test.sql

      - name: Apply player card collectibles migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261012150000_player_card_collectibles.sql

      - name: Apply 1v1-only collectible follow-up migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261012160000_collectibles_1v1_only.sql

      - name: Apply secure player card trading migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261012170000_player_card_trading.sql

      - name: Player card collectibles regression
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/player_card_collectibles.test.sql

      - name: Apply AI deck builder quota migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261012180000_smart_deck_builder_quota.sql

      - name: AI deck builder quota regression
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/smart_deck_builder_quota.test.sql

      - name: Prepare isolated accumulator RPCs for temp-table regression
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/model_accumulator_temp_table_clear_test_setup.sql

      - name: Repair accumulator temp-table clear statements
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261015131120_fix_model_accumulator_temp_table_clear.sql

      - name: Accumulator temp-table clear regression
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/model_accumulator_temp_table_clear.test.sql

      - name: Prepare disposable profile, odds and fine-tuning schema
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/profile_market_finetune_test_setup.sql

      - name: Apply profile backfill, multi-market and fine-tuning migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261015131108_profile_backfill_multimarket_finetune.sql

      - name: Fix bounded profile queue starvation
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261015131830_fix_profile_backfill_enqueue_starvation.sql

      - name: Route profile photos around Soccer Wiki-owned cards
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261015194922_route_profile_backfill_around_soccerwiki.sql

      - name: Preserve no-data profile queue diagnostics
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261015200557_preserve_profile_backfill_no_data_reason.sql

      - name: Add Soccer Wiki photo backfill task type
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261016133835_add_soccerwiki_photo_backfill.sql

      - name: Fix photo source fallback and queue retry semantics
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261021110602_fix_photo_backfill_pipeline_20261021.sql

      - name: Disable unverified legacy photo bulk writes
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261021111705_disable_unverified_photo_bulk_write_20261021.sql

      - name: Defer photo queue retries and reclaim stale leases
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261021113947_photo_backfill_retry_backoff_20261021.sql

      - name: Requeue legacy photo jobs misclassified as transport failures
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261021171000_requeue_photo_tm_no_data_failures.sql

      - name: Verify legacy photo no-data requeue
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/photo_backfill_requeue_no_data.test.sql

      - name: Verify Soccer Wiki detail timestamp for photo refresh regression
        run: psql -v ON_ERROR_STOP=1 -c "select detail_at from public.soccerwiki_player limit 0"

      - name: Profile queue, quota, settlement and fine-tuning SQL regressions
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/profile_backfill_multimarket.test.sql

      - name: Apply Smart Deck trend analytics migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261018085926_player_smart_deck_trends.sql

      - name: Smart Deck trend analytics regression
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/player_smart_deck_trends.test.sql

      - name: Prepare player stats refresh checkpoint fixtures
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/player_stats_refresh_checkpoint_existing_schema_setup.sql

      - name: Apply player stats refresh checkpoint migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261027213000_player_stats_refresh_checkpoint.sql

      - name: Verify player stats refresh checkpoint
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/player_stats_refresh_checkpoint.test.sql

      - name: Test player stats refresh queue
        run: python3 docs/test_players_stats_transfermarkt.py
