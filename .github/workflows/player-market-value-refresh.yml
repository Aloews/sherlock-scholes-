name: player-market-value-refresh

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/player-market-value-refresh.yml'
      - 'docs/players_market_value_transfermarkt.py'
      - 'docs/test_players_market_value_transfermarkt.py'
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Maximum player valuations to refresh'
        required: false
        type: string
        default: '800'

permissions:
  contents: read

concurrency:
  group: player-profile-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      odegaard_outcome: ${{ steps.odegaard.outcome }}
      kane_outcome: ${{ steps.kane.outcome }}
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: football_scraper/requirements.txt

      - name: Install dependencies
        run: pip install -r football_scraper/requirements.txt

      - name: Test source-date guard and stale-first rotation
        run: python docs/test_players_market_value_transfermarkt.py

      - name: Verify production credentials and target
        run: |
          test -n "$SUPABASE_URL" || { echo "::error::SUPABASE_URL is missing"; exit 1; }
          test -n "$SUPABASE_KEY" || { echo "::error::SUPABASE_KEY is missing"; exit 1; }
          host="$(python -c 'import os, urllib.parse; print(urllib.parse.urlparse(os.environ["SUPABASE_URL"]).hostname or "")')"
          [ "$host" = "konoavrduynecxblqfvq.supabase.co" ] || {
            echo "::error::SUPABASE_URL does not target the configured production project"
            exit 1
          }

      - name: Record production write verification cutoff
        id: refresh_start
        run: echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Refresh Martin Odegaard's source valuation first
        id: odegaard
        continue-on-error: true
        env:
          TMAPI_DIAGNOSTICS: '1'
          TMAPI_DIAGNOSTIC_FAST: '1'
        run: APPLY=1 python docs/players_market_value_transfermarkt.py --from-cards --refresh --only 316264

      - name: Refresh Harry Kane's source valuation first
        id: kane
        continue-on-error: true
        env:
          TMAPI_DIAGNOSTICS: '1'
          TMAPI_DIAGNOSTIC_FAST: '1'
        run: APPLY=1 python3 docs/players_market_value_transfermarkt.py --from-cards --refresh --only 132098

      - name: Require working source before the full batch
        if: always()
        env:
          ODEGAARD_OUTCOME: ${{ steps.odegaard.outcome }}
          KANE_OUTCOME: ${{ steps.kane.outcome }}
          REFRESH_STARTED_AT: ${{ steps.refresh_start.outputs.started_at }}
        run: |
          echo "Ødegaard source outcome = $ODEGAARD_OUTCOME"
          echo "Kane source outcome = $KANE_OUTCOME"
          [ "$ODEGAARD_OUTCOME" = "success" ] || {
            echo "::error::Market-value source check failed for Ødegaard; skipping the 800-player batch."
            exit 1
          }
          [ "$KANE_OUTCOME" = "success" ] || {
            echo "::error::Market-value source check failed for Kane; skipping the 800-player batch."
            exit 1
          }

          verify_written() {
            tm_id="$1"
            player="$2"
            rows="$(curl -fsS --get \
              --data-urlencode "select=id,market_value_eur,market_value_at,market_value_checked_at" \
              --data-urlencode "transfermarkt_id=eq.$tm_id" \
              --data-urlencode "category=in.(player,woman)" \
              --data-urlencode "active=eq.true" \
              --data-urlencode "market_value_eur=not.is.null" \
              --data-urlencode "market_value_at=not.is.null" \
              --data-urlencode "market_value_checked_at=gte.$REFRESH_STARTED_AT" \
              --data-urlencode "limit=2" \
              "$SUPABASE_URL/rest/v1/cards" \
              -H "apikey: $SUPABASE_KEY" \
              -H "Authorization: Bearer $SUPABASE_KEY")"
            echo "$rows" | jq -e 'length >= 1' >/dev/null || {
              echo "::error::Source lookup passed but $player valuation was not confirmed in production after $REFRESH_STARTED_AT; skipping the batch."
              exit 1
            }
            echo "$player: production write verified"
          }

          verify_written 316264 "Martin Odegaard"
          verify_written 132098 "Harry Kane"

      - name: Refresh high-value priority and oldest market valuations from Transfermarkt
        env:
          TMAPI_DIAGNOSTICS: '1'
        run: |
          limit="${{ inputs.limit || '800' }}"
          case "$limit" in
            ''|*[!0-9]*) echo "::error::limit must be a positive integer"; exit 2 ;;
          esac
          if [ "$limit" -lt 1 ] || [ "$limit" -gt 1200 ]; then
            echo "::error::limit must be between 1 and 1200"
            exit 2
          fi
          APPLY=1 python docs/players_market_value_transfermarkt.py --from-cards --refresh --limit "$limit"

      - name: Refresh award and team-tournament candidates after market values
        run: python3 docs/award_candidates_build.py

  watch:
    runs-on: ubuntu-latest
    needs: [refresh]
    if: always()
    timeout-minutes: 5
    env:
      REFRESH_RESULT: ${{ needs.refresh.result }}
      ODEGAARD_RESULT: ${{ needs.refresh.outputs.odegaard_outcome }}
      KANE_RESULT: ${{ needs.refresh.outputs.kane_outcome }}
    steps:
      - name: Verify market value refresh completed
        run: |
          echo "refresh = $REFRESH_RESULT"
          [ "$REFRESH_RESULT" = "success" ] || {
            echo "::error::refresh: $REFRESH_RESULT"
            exit 1
          }
          [ "$ODEGAARD_RESULT" = "success" ] || {
            echo "::error::Martin Odegaard's source valuation refresh failed: $ODEGAARD_RESULT"
            exit 1
          }
          [ "$KANE_RESULT" = "success" ] || {
            echo "::error::Harry Kane's source valuation refresh failed: $KANE_RESULT"
            exit 1
          }
