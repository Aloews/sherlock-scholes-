name: player-stats

# Per-match football statistics from sports.ru, every morning.
#
# WHY EVERY MORNING AND NOT EVERY HOUR. The rating windows are 7, 30 and 365
# days, so the smallest thing this feeds is a whole day. Reading 1200 player
# pages more often than that would spend somebody else's bandwidth to move a
# weekly number by nothing.
#
# 04:40 UTC: after the American evening kick-offs have finished and before the
# European morning, so a run sees a complete previous day rather than cutting
# through the middle of one. It also lands ahead of daily-enrich (05:00), which
# is a separate pipeline touching a separate table — they share only the repo.

on:
  schedule:
    - cron: '40 4 * * *'
  workflow_dispatch:
    inputs:
      resolve_only:
        description: 'Only rebuild the card -> slug map'
        type: boolean
        default: false
      limit:
        description: 'Cap how many player pages are read'
        type: string
        default: ''

# Two overlapping runs would read the same pages twice and race on the same
# rows for nothing.
concurrency:
  group: player-stats
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    # ~1200 players at a 1.2 s pause is ~25 minutes of fetching; the slug pass
    # adds the club crawl. The ceiling is set so a slow night ends by running
    # out of BUDGET (a number this repo controls) rather than by being cut off
    # mid-write.
    timeout-minutes: 180
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}   # service_role — repo secret, NEVER committed
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: football_scraper/requirements.txt

      - name: Install deps
        run: pip install -r football_scraper/requirements.txt

      # The parsers are pure and their tests need no network and no secrets, so
      # they run BEFORE the crawl. A markup change that shifts the stat columns
      # produces believable numbers, and believable wrong numbers are exactly
      # what must not reach the table. The _stats tests cover the same risk on
      # the matching side — active_cards_by_key is what stops a retired
      # legend's bare-name card from absorbing a namesake's real matches (see
      # docs/namesake_fixes.sql); a regression there is exactly the kind of
      # believable-wrong-number bug this step exists to catch before the run.
      - name: Parser tests
        working-directory: football_scraper
        run: |
          python3 tests/test_sports_ru.py
          python3 tests/test_espn.py
          python3 tests/test_sports_ru_stats.py
          python3 tests/test_espn_stats.py

      - name: Collect
        working-directory: football_scraper
        run: |
          args=""
          if [ "${{ inputs.resolve_only }}" = "true" ]; then args="$args --resolve"; fi
          if [ -n "${{ inputs.limit }}" ]; then args="$args --limit ${{ inputs.limit }}"; fi
          python3 sports_ru_stats.py $args

      # Второй источник для той же таблицы. Отдельным шагом и с `if: always()`:
      # источники независимы, и падение одного не должно уносить второй —
      # иначе редкая поломка sports.ru тихо оставляла бы рейтинг без ESPN.
      - name: Collect (ESPN)
        if: always()
        working-directory: football_scraper
        # Двое суток, а не одни: матч, начавшийся в 23:30 UTC, заканчивается
        # уже «завтра», и обход только за сегодня терял бы его каждый раз.
        #
        # Лиг здесь втрое больше прежних четырнадцати, а шаг от этого почти
        # не подорожал: обход спрашивает расписание ОКНОМ КАЛЕНДАРНОГО
        # МЕСЯЦА, то есть одним запросом на лигу вместо двух. Замер
        # 13.09.2026: по запросу за расписанием на лигу и 163 матча за двое
        # суток — около двухсот запросов на шаг вместо ста.
        #
        # ⚠️ ОКНО БЫЛО ДИАПАЗОНОМ `dates=A-B`, И ESPN ЕГО ПОХОРОНИЛ. С 16 по
        # 20 сентября 2026 каждый ночной прогон кончался «success» и строкой
        # `matches read: 0`: 400 на каждую лигу читались как «матчей нет».
        # Теперь молчание табло попадает в список незаписанных и валит шаг.
        #
        # Падение одной лиги стоит одной лиги: запись идёт по лиге, а список
        # незаписанных печатается в конце и даёт ненулевой код возврата.
        # Починить такой прогон можно точечно: `--leagues eng.2,ita.2`.
        run: python3 espn_stats.py --days 2

      # ⚠️ СТАТИСТИКА ПЛАНИРОВЩИКУ ПОСЛЕ ЗАГРУЗКИ, А НЕ КОГДА-НИБУДЬ.
      # Экран рейтинга игроков ходит АНОНИМОМ, а у анонима потолок в три секунды.
      # Замер 20.09.2026: сразу после догрузки 19 219 строк первый вызов
      # `player_ratings` стоил 3164 мс и падал с `statement timeout`, после
      # `analyze player_match_stats` — 179 мс. Автовакуум добрался бы туда
      # сам, но позже, а «позже» здесь значит «утром экран не грузится».
      #
      # `if: always()` — потому что обновить статистику надо и после шага,
      # упавшего на одной лиге: строки остальных уже записаны.
      # Ключи берутся из env всего job-а (выше): отдельный набор здесь
      # завёл бы ВТОРОЕ имя секрета, а забытый секрет молча даёт 401 и шаг,
      # который «прошёл».
      # ⚠️ ПОРЯДОК ВНУТРИ СПИСКА ЗНАЧИМ: сначала СОБРАТЬ экспрессы, потом
      # СВЕСТИ сыгранные. Наоборот тоже отработало бы (сведение смотрит только
      # на завершённые матчи), но тогда билет, собранный на сегодня, ждал бы
      # сведения лишние сутки.
      #
      # ⚠️ ЭТО ДУБЛИРУЕТ pg_cron, И ДУБЛИРУЕТ НАМЕРЕННО. `build-model-accumulators`
      # стоит в расписании базы на 07:10; шаг здесь — второй, независимый путь.
      # Сборка идемпотентна (уникальный индекс по правилу и игровому дню), так
      # что двойной запуск ничего не портит, а смерть одного из двух путей не
      # оставляет экран без экспрессов.
      - name: Освежить статистику планировщику и кэш рейтинга
        if: always()
        run: |
          for fn in refresh_stats_planner refresh_player_rating_cache build_model_accumulators settle_accumulators; do
            code=$(curl -sS -X POST "$SUPABASE_URL/rest/v1/rpc/$fn" \
              -H "apikey: $SUPABASE_KEY" \
              -H "Authorization: Bearer $SUPABASE_KEY" \
              -H "Content-Type: application/json" -d '{}' \
              -o /dev/null -w '%{http_code}')
            echo "$fn: HTTP $code"
            # ⚠️ КОД ОТВЕТА ПРОВЕРЯЕТСЯ, А НЕ ПЕЧАТАЕТСЯ. Забытый секрет даёт
            # 401, и шаг, который просто печатает число, «проходит» — а кэш
            # не обновляется неделями, и экран тихо показывает прошлую неделю
            # как эту. Ровно так же молчал сбор ESPN.
            [ "$code" = "200" ] || { echo "::error::$fn ответила $code"; exit 1; }
          done
