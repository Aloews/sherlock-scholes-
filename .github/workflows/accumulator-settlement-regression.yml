name: accumulator-settlement-regression

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  accumulator-settlement:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: accumulator_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d accumulator_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: accumulator_test
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client
      - name: Create isolated accumulator fixtures
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/accumulator_settlement_test_setup.sql
      - name: Apply accumulator settlement/security migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261021110000_accumulator_settlement_security_observability.sql
      - name: Verify generation diagnostics, cron jobs, and RLS
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/accumulator_settlement_regression.test.sql
