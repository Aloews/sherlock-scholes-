name: profile-backfill-queue

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/profile-backfill-queue.yml"
      - "docs/profile_backfill_queue.py"
      - "docs/cards_photo_transfermarkt.py"
      - "docs/test_cards_photo_transfermarkt.py"
      - "supabase/migrations/*profile_backfill*"
  workflow_run:
    workflows: ["soccerwiki-roster-refresh"]
    types: [completed]
  schedule:
    # Bounded, resumable batches throughout the day; concurrency prevents overlapping workers.
    - cron: "17 */4 * * *"
  workflow_dispatch:
    inputs:
      enqueue_only:
        description: "Only enqueue missing tasks; do not call external sources"
        type: boolean
        default: true
      max_jobs:
        description: "Maximum tasks to process in this run"
        type: string
        default: "10"
      enqueue_limit:
        description: "Maximum new tasks to enqueue before processing"
        type: string
        default: "10"

concurrency:
  group: profile-backfill-queue
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate arguments and queue worker tests
        env:
          MAX_JOBS: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_run' || github.event_name == 'push') && '300' || inputs.max_jobs || '10' }}
          ENQUEUE_LIMIT: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_run' || github.event_name == 'push') && '100' || inputs.enqueue_limit || '10' }}
        run: |
          python docs/test_profile_backfill_queue.py
          test -n "$SUPABASE_URL" || { echo "::error::SUPABASE_URL secret is missing"; exit 2; }
          test -n "$SUPABASE_KEY" || { echo "::error::SUPABASE_KEY secret is missing"; exit 2; }
          case "$MAX_JOBS" in
            ''|*[!0-9]*) echo "::error::max_jobs must be a positive integer"; exit 2 ;;
          esac
          [ "$MAX_JOBS" -ge 1 ] && [ "$MAX_JOBS" -le 500 ] || {
            echo "::error::max_jobs must be between 1 and 500"; exit 2;
          }
          case "$ENQUEUE_LIMIT" in
            ''|*[!0-9]*) echo "::error::enqueue_limit must be a positive integer"; exit 2 ;;
          esac
          [ "$ENQUEUE_LIMIT" -ge 1 ] && [ "$ENQUEUE_LIMIT" -le 100000 ] || {
            echo "::error::enqueue_limit must be between 1 and 100000"; exit 2;
          }
      - name: Enqueue gaps and process a bounded batch
        env:
          ENQUEUE_ONLY: ${{ github.event_name == 'schedule' && 'false' || inputs.enqueue_only }}
          MAX_JOBS: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_run' || github.event_name == 'push') && '300' || inputs.max_jobs || '10' }}
          ENQUEUE_LIMIT: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_run' || github.event_name == 'push') && '100' || inputs.enqueue_limit || '10' }}
        run: |
          if [ "$ENQUEUE_ONLY" = "true" ]; then
            python docs/profile_backfill_queue.py --enqueue-only --enqueue-limit "$ENQUEUE_LIMIT"
          else
            python docs/profile_backfill_queue.py --max-jobs "$MAX_JOBS" --batch-size 10 --enqueue-limit "$ENQUEUE_LIMIT"
          fi
      - name: Upload per-task verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: profile-backfill-result
          path: profile-backfill-result.jsonl
          if-no-files-found: ignore

  watch:
    needs: [backfill]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BACKFILL_RESULT: ${{ needs.backfill.result }}
    steps:
      - name: Verify bounded profile enrichment completed
        run: |
          echo "backfill = $BACKFILL_RESULT"
          [ "$BACKFILL_RESULT" = "success" ] || { echo "::error::backfill: $BACKFILL_RESULT"; exit 1; }
