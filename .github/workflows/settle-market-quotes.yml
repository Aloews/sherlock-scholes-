name: settle-market-quotes

on:
  workflow_dispatch:
    inputs:
      fixture_id:
        description: "Optional provider fixture ID; blank settles all completed fixtures"
        type: string
        required: false
        default: ""
      confirm_regulation_scores:
        description: "Confirm this competition's fixture scores are regulation-time scores"
        type: boolean
        required: true
        default: false

concurrency:
  group: settle-market-quotes
  cancel-in-progress: false

jobs:
  settle:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      FIXTURE_ID: ${{ inputs.fixture_id }}
    steps:
      - name: Validate configuration
        run: |
          [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_KEY" ] || {
            echo "::error::Supabase secrets are required"; exit 2;
          }
          [ "${{ inputs.confirm_regulation_scores }}" = "true" ] || {
            echo "::error::Confirm regulation-time scores before settlement"; exit 2;
          }
      - name: Settle only completed fixtures and verify RPC response
        run: |
          if [ -n "$FIXTURE_ID" ]; then
            payload=$(jq -n --arg id "$FIXTURE_ID" '{p_fixture_id:$id,p_confirm_regulation_scores:true}')
          else
            payload='{"p_fixture_id":null,"p_confirm_regulation_scores":true}'
          fi
          code=$(curl -sS -X POST "$SUPABASE_URL/rest/v1/rpc/settle_fixture_market_quotes" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            -H "Content-Type: application/json" \
            -d "$payload" -o /tmp/settlement.json -w '%{http_code}')
          [ "$code" = "200" ] || { cat /tmp/settlement.json; exit 1; }
          cat /tmp/settlement.json
