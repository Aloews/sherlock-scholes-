name: player-enrichment-queue

on:
  schedule:
    - cron: "17 12 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: Maximum number of per-player tasks to claim
        required: true
        type: number
        default: 250

concurrency:
  group: player-profile-data
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      BATCH_LIMIT: ${{ inputs.limit || 250 }}
      GITHUB_RUN_ID: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: football_scraper/requirements.txt

      - name: Install scraper dependencies
        run: pip install -r football_scraper/requirements.txt

      - name: Validate configuration and batch size
        if: ${{ vars.PLAYER_ENRICHMENT_ENABLED == 'true' }}
        run: |
          test -n "$SUPABASE_URL" || { echo "::error::SUPABASE_URL secret is required"; exit 2; }
          test -n "$SUPABASE_KEY" || { echo "::error::SUPABASE_KEY secret is required"; exit 2; }
          case "$BATCH_LIMIT" in ''|*[!0-9]*) echo "::error::limit must be an integer"; exit 2;; esac
          [ "$BATCH_LIMIT" -ge 1 ] && [ "$BATCH_LIMIT" -le 250 ] || { echo "::error::limit must be between 1 and 250"; exit 2; }

      - name: Audit profile gaps before processing
        if: ${{ vars.PLAYER_ENRICHMENT_ENABLED == 'true' }}
        run: python docs/player_data_audit.py --skip-match-scan --output-dir artifacts/player-data-audit/before

      - name: Enqueue gaps, process one batch, verify every task
        if: ${{ vars.PLAYER_ENRICHMENT_ENABLED == 'true' }}
        run: python docs/player_enrichment_queue.py --enqueue --run --limit "$BATCH_LIMIT"

      - name: Audit profile gaps after processing
        if: ${{ always() && vars.PLAYER_ENRICHMENT_ENABLED == 'true' }}
        run: python docs/player_data_audit.py --skip-match-scan --output-dir artifacts/player-data-audit/after

      - name: Queue disabled until migration is approved
        if: ${{ vars.PLAYER_ENRICHMENT_ENABLED != 'true' }}
        run: echo "Queue skipped safely. Apply the migration, verify RLS and set PLAYER_ENRICHMENT_ENABLED=true to enable processing."

      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: player-enrichment-audit-${{ github.run_id }}
          path: artifacts/player-data-audit/
          if-no-files-found: warn
          retention-days: 30

  watch:
    runs-on: ubuntu-latest
    needs: [enrich]
    if: always()
    timeout-minutes: 10
    env:
      ENRICH_RESULT: ${{ needs.enrich.result }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify scheduled enrichment job outcome
        run: |
          echo "enrich = $ENRICH_RESULT"
          [ "$ENRICH_RESULT" = "success" ] || { echo "::error::enrichment workflow job did not succeed: $ENRICH_RESULT"; exit 1; }
