name: daily-enrich

# Daily deck enrichment + health audit. Runs the orchestrator (docs/daily_enrich.py)
# then the read-only audit (docs/cards_audit.py, which fails the job on
# career_stats corruption). The Wikimedia budget + scrape caches live in
# football_scraper/cache and are carried between runs via actions/cache so the
# daily budget and resume progress survive.

on:
  schedule:
    - cron: '0 5 * * *'   # 05:00 UTC daily
  workflow_dispatch: {}    # allow manual runs

# Don't pile up overlapping daily runs (they share the budget/cache).
concurrency:
  group: daily-enrich
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    # Каждый запрос к Wikimedia идёт с обязательной паузой в 1 с, поэтому
    # потолок в 100 минут сам по себе резал ночь примерно на 6000 запросов —
    # меньше дневного бюджета. Ставим с запасом, чтобы упирались в бюджет,
    # а не в таймер (максимум GitHub — 360 минут).
    timeout-minutes: 330
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}   # service_role — repo secret, NEVER committed
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: football_scraper/requirements.txt

      - name: Install deps
        run: pip install -r football_scraper/requirements.txt

      # Restore the scrape cache + budget files. The unique key makes each run
      # save a fresh cache; restore-keys pulls the most recent prior one, so
      # budget counters and resume progress carry forward day to day.
      - name: Restore scraper cache
        id: cache
        uses: actions/cache@v4
        with:
          path: football_scraper/cache
          key: scraper-cache-${{ github.run_id }}
          restore-keys: |
            scraper-cache-

      # Выбросить из восстановленного кеша записи «ничего не найдено». Кеш
      # без TTL и переезжает между прогонами, поэтому один промах иначе
      # отвечает «статьи нет» вечно и шаг молча работает вхолостую
      # («115 карточек обработано, бюджет 0/20000»). Только диск, без сети.
      - name: Prune stale cache misses
        run: APPLY=1 python docs/cache_prune_empty.py

      - name: Run daily enrichment
        run: python docs/daily_enrich.py

      # ⚠️ ОДИН ШАГ НА ВСЕ ЯЗЫКИ, А НЕ ДВА. Здесь стояли ДВА сбора просмотров,
      # и разбор ночного лога 06.09.2026 показал, зачем их свели в один:
      #
      #   cards_pageviews_i18n.py --limit 600
      #     → «бюджет Wikimedia исчерпан», Готово: 0/600, записано 0.
      #       ДВЕНАДЦАТЬ МИНУТ И ПЯТНАДЦАТЬ СЕКУНД на нулевой результат:
      #       бюджет общий (photos_budget.json), его выел шаг выше, а этот
      #       проверял бюджет ПОСЛЕ резолва, а не до.
      #   cards_pageviews_world.py --home --limit 600
      #     → дошёл до 275 из 593 и был убит: exit 143 это SIGTERM, то есть
      #       потолок job'а в 330 минут.
      #   cards_fame_refresh.py
      #     → exit 143 сразу же, НЕ ВЫПОЛНИЛСЯ ВОВСЕ. Слава — перцентиль, и
      #       она осталась несчитанной, хотя просмотры менялись.
      #
      # Скрипты делали пересекающуюся работу разного качества. `i18n` искал
      # статью ПО ИМЕНИ — и именно так карточка «Роналдо (2000)» из «Ростова»
      # получила 501 492 просмотра ЛЕГЕНДЫ, а карточка Georgios Papadopoulos
      # 2002 г.р. — 116 835 просмотров статьи о греческом диктаторе. `world`
      # идёт от QID через sitelinks и отбраковывает гардом P31 тех, кого
      # резолв привёл не на человека. Остаётся он, с `--all`: все разделы, где
      # статья есть, а не девять локалей приложения.
      - name: Collect pageviews in every language
        if: always()
        run: APPLY=1 python docs/cards_pageviews_world.py --all --limit 600 --minutes 150

      # Внешние идентификаторы карточек: QID -> P2446 (Transfermarkt) и P27 ->
      # страна. Без QID карточку не обогатить, а резолв по ИМЕНИ промахивается
      # молча («Гарри Невилл» в ру-вики — «Невилл, Гари»).
      # ⚠️ P2446 берётся через wbgetentities, НЕ через SPARQL: WDQS при
      # лимитировании режет до одного запроса в минуту, и замер той же выборки
      # дал SPARQL — ноль ответов, wbgetentities — 799 из 846.
      - name: External ids from Wikidata (Transfermarkt, country)
        if: always()
        run: APPLY=1 python docs/cards_wikidata_ids.py --from-db --limit 800

      # Русские имена клубов для career_stats (и латинские для legend_career):
      # summary-экран показывает названия на языке интерфейса. Резолвы
      # кешируются, поэтому после первой ночи шаг почти мгновенный.
      - name: Localize career club names
        if: always()
        run: APPLY=1 python docs/cards_career_localize.py

      # Описания неигровых карточек (cards.descriptions): клубы, стадионы,
      # тренеры, судьи, комментаторы, дерби, трофеи получают короткий блёрб из
      # преамбулы своей статьи в Википедии. Игроков шаг не трогает — у них
      # facts/career_stats. Запись только там, где descriptions IS NULL, так
      # что ручной текст не перетирается, а повтор — no-op. ~120 карточек за
      # ночь: остаток колоды (~630) закрывается примерно за неделю, дальше
      # шаг подхватывает только новые карточки.
      # Без --limit: шаг идёт до конца очереди и сам вежливо останавливается
      # на дневном бюджете Wikimedia, сохранив прогресс в кеше. Искусственный
      # потолок в 120 карточек только растягивал сбор на недели.
      - name: Build non-player card descriptions
        if: always()
        run: APPLY=1 python docs/cards_descriptions_build.py

      # Добор английских описаний там, где русское уже есть. Обычный прогон
      # выше их не видит (карточка уже не пустая), а без en интерфейс на
      # остальных 8 языках показывает русский текст.
      - name: Backfill English card descriptions
        if: always()
        run: APPLY=1 python docs/cards_descriptions_build.py --missing-en

      # Ревизия name_en у карточек-людей: чинит те, где мононим утащил статью
      # однофамильца («Данте» → Dante Alighieri, «Адриан» → Hadrian), и
      # обнуляет доказанно чужие значения. Только мононимы — там весь риск.
      - name: Audit name_en on mononym cards
        if: always()
        run: APPLY=1 python docs/cards_name_en_audit.py --mononyms-only

      # Пересчёт pageviews там, где счёт был снят с чужой статьи (клуб
      # «Краснодар» мерился статьёй о городе). Резолвы уже в кеше, поэтому
      # шаг тратит бюджет почти только на сами просмотры.
      - name: Re-measure pageviews scored from the wrong article
        if: always()
        run: APPLY=1 python docs/cards_pageviews_refix.py

      # Эмблемы клубам из ESPN. Клуб без карточки не получал герб НИКОГДА:
      # crest_url копировался только из cards.photo_url. Пишется только туда,
      # где эмблемы не было: ручной герб не перетирается, повтор — no-op.
      #
      # ⚠️ Сопоставляет БАЗА (apply_espn_crests), а не скрипт: club_match_key
      # и club_alias серверные, и вторая копия правила разошлась бы с ними
      # молча, выдав клубу чужой герб.
      #
      # ⚠️ ЭТОТ ШАГ ПАДАЛ БЫ КАЖДУЮ НОЧЬ, пока не применён
      # supabase/migrations/espn_crests_match_once.sql. Прежняя функция
      # звала нормализатор на каждую пару «клуб × имя ESPN» — три миллиона
      # вызовов — и отвечала 57014 statement timeout уже на 200 именах
      # (замер 04.09.2026). После починки: 1.5 с на все 1814.
      #
      # ⚠️ И ЗАКРЫВАЕТ ОН НЕ 587 КЛУБОВ, А 30. Замер после боевого прогона:
      # из 610 клубов без эмблемы совпали 30, а у 514 из оставшихся 580 нет
      # ЛАТИНСКОГО имени вообще — только русское, и обратно оно не
      # транслитерируется («Аль-Айн» → al ayn против ESPN al ain). Их
      # закроет не другой источник эмблем, а name_en.
      - name: Club crests from ESPN
        if: always()
        run: APPLY=1 python docs/clubs_crests_espn.py

      # Рыночная стоимость игроков составов. ИСТОЧНИК — TRANSFERMARKT, через
      # P2446 в Викиданных; происхождение записано и в шапке скрипта, и в
      # комментариях колонок cards.market_value_eur / market_value_at.
      #
      # Замер 04.09.2026: игроков в открытых составах 1362, стоимость была у
      # НУЛЯ из них. Уровень игрока до сих пор считался из просмотров статьи —
      # это известность, а не футбольная сила.
      #
      # ⚠️ Шаг идёт ПОСЛЕ ревизии name_en: резолв карточки в QID берёт имя
      # оттуда, и на исправленном имени он попадает в цель чаще.
      #
      # Дозой, а не всем скопом: у шага общий с фотографиями бюджет Wikimedia,
      # а у Transfermarkt — своя вежливая пауза. Кто уже с ценой, того шаг
      # пропускает, поэтому за несколько ночей состав закрывается целиком.
      - name: Player market value from Transfermarkt
        if: always()
        run: APPLY=1 python docs/players_market_value_transfermarkt.py --limit 400

      # ПОЛНЫЕ составы клубов со стоимостью — одной страницей на клуб.
      # Составы из Викиданных неполны (1362 строки на 294 клуба, полная
      # заявка у 42), а страница клуба на Transfermarkt отдаёт весь состав с
      # ценами сразу.
      #
      # ⚠️ Мост «клуб → id на TM» строится ГОЛОСОВАНИЕМ игроков, а не по
      # одному: состав в club_squad местами устарел, и у «Байерна» игрок,
      # ушедший в «Аугсбург», привёл мост на чужой клуб — 28 игроков, 27 с
      # ценой, 177.8 млн €, числа правдоподобные. Клуб принимается, только
      # если минимум двое игроков указали на один и тот же verein.
      #
      # ⚠️ Пустой разбор НЕ стирает состав: ростер заменяется целиком, и
      # сломавшийся на смене вёрстки разбор иначе очистил бы все клубы.
      #
      # Мост кэшируется в football_club.transfermarkt_id, поэтому со второй
      # ночи шаг стоит один запрос на клуб.
      # ⚠️ БЕЗ ЭТОГО ШАГА СЛЕДУЮЩИЙ НЕ ВИДИТ НОВЫХ КЛУБОВ ВООБЩЕ. Мост
      # «клуб → verein» там строится ГОЛОСОВАНИЕМ игроков состава — а у клуба,
      # впервые появившегося в расписании, состава нет, и голосовать некем.
      # Замер 05.09.2026: в расписании 435 клубов, мост был у 76.
      #
      # P7223 в Викиданных даёт тот же идентификатор без единого голоса
      # (проверено: «Челси» Q9616 → 631, ровно наш verein/631). Неоднозначное
      # не берётся: у «Анже» есть и вторая команда «Angers SCO II».
      #
      # НЕ `--playing`: клубов 1545, латинского имени нет у 1128, и русское имя
      # ищется по-русски — ограничивать выборку расписанием значит оставить
      # без состава всех остальных. Срез за ночь ограничен числом, а не
      # признаком, и перемешан семенем от даты: иначе шаг каждую ночь
      # перебирал бы одни и те же первые 400.
      - name: Club bridge to Transfermarkt (Wikidata P7223)
        if: always()
        run: APPLY=1 python docs/clubs_transfermarkt_id_wikidata.py --limit 400

      - name: Full club rosters with values (Transfermarkt)
        if: always()
        run: APPLY=1 python docs/clubs_roster_transfermarkt.py --limit 200

      # ⚠️ БЕЗ ЭТОГО ШАГА ПРЕДЫДУЩИЙ КАЖДУЮ НОЧЬ ОТРАЩИВАЕТ ДЫРУ ЗАНОВО.
      # `apply_club_roster` связывает строку с карточкой только по
      # `cards.transfermarkt_id`; у карточки его обычно нет, и строка ложится
      # с `card_id = null`. Так Беллингем и «пропал» из состава «Реала» на
      # экране, оставаясь в колоде активной карточкой. Мост строится здесь:
      # id на Transfermarkt → (P2446, обратно) → QID → карточка, затем точное
      # имя в пределах клуба. Неоднозначное не связывается и печатается числом.
      #
      # Вторым делом шаг дописывает верный QID тем карточкам, у которых он был
      # снят как НЕ ЧЕЛОВЕЧЕСКИЙ (страница фамилии, персонаж Marvel): ночной
      # резолв идёт по имени и ту же страницу теперь отвергает, то есть сам
      # такую карточку не починит НИКОГДА.
      - name: Link rosters to deck cards
        if: always()
        run: APPLY=1 python docs/roster_link_cards.py

      # ⚠️ ЭТОТ ШАГ И ЕСТЬ «ВСЕ ФУТБОЛИСТЫ». Связывание выше находит тех, кто
      # в колоде УЖЕ есть; здесь заводятся те, кого в ней нет. Прежний путь
      # завести их не мог в принципе: он требовал статьи в РУССКОЙ Википедии,
      # а её нет у большинства футболистов мира. Замер после первого прогона:
      # 3662 новых карточки, из них 976 с латинским именем — ровно те, кого
      # старый резолв отбрасывал.
      #
      # Поиска по имени здесь нет вовсе: tm_player_id → (P2446, обратно) →
      # QID → ярлыки всех языков. Гард — P31=Q5 И P106=Q937857, иначе в
      # колоду попадут тренеры со страницы клуба.
      - name: Create cards for roster players (general Wikipedia)
        if: always()
        run: APPLY=1 python docs/cards_from_roster.py --limit 3000

      # ⚠️ БЕЗ ЭТОГО ШАГА ПРЕДЫДУЩИЙ ЗАВОДИЛ ПУСТЫЕ КАРТОЧКИ. Данные лежали
      # рядом, в `club_roster`, снятые с той же страницы клуба: позиция,
      # гражданство, стоимость, номер. Ночью их никто не переносил, и досье у
      # новичка открывалось пустым — владелец это и увидел в проде. Разовый
      # вызов тех же двух функций руками дал 9218 позиций, 8656 стоимостей и
      # 12 491 текущий клуб (06.09.2026).
      #
      # Строго ПОСЛЕ заведения карточек: заполнение идёт по
      # `club_roster.card_id`, до заведения ему нечего делать.
      - name: Fill new cards from rosters (position, value, country, club)
        if: always()
        run: python docs/roster_fill_cards.py

      # ⚠️ ПРОДОЛЖАЕТ ОБХОД, А НЕ НАЧИНАЕТ ЕГО СНАЧАЛА. У Soccer Wiki 240
      # стран и около 2900 клубов — это примерно семь тысяч запросов, в ночное
      # окно они не влезают. `--stale-days 7` пропускает клубы, прочитанные на
      # этой неделе, `--minutes` держит потолок: за неделю мир обходится
      # целиком, каждую ночь — своим куском.
      - name: Soccer Wiki squads (world sweep, resumable)
        if: always()
        run: APPLY=1 python docs/soccerwiki_squads.py --stale-days 7 --minutes 40

      # Страница игрока: рост, вес, нога, ДАТА РОЖДЕНИЯ. Идёт только по
      # связанным с колодой — 13 тысяч запросов вместо пятидесяти, — и по
      # убыванию рейтинга: прогон оборвётся на любом месте, и порядок решает,
      # чья карточка успеет получить данные.
      - name: Soccer Wiki player pages (height, foot, birth date)
        if: always()
        run: APPLY=1 python docs/soccerwiki_players.py --minutes 40

      # ⚠️ БЕЗ ЭТОГО ШАГА ДВА ПРЕДЫДУЩИХ СОБИРАЮТ В СТОЛ. `apply_soccerwiki_squad`
      # связывает состав с колодой в момент записи клуба; всё, что появилось
      # позже — новая карточка, доехавший name_en, починенный resolved_key, —
      # остаётся несвязанным навсегда. Замер 07.09.2026: связано 13 129
      # игроков, а рейтинг стоял у 6301 карточки.
      - name: Re-link Soccer Wiki squads to the deck
        if: always()
        run: python docs/soccerwiki_link_refresh.py

      # Read-only health report; FAILS the job if any career_stats row still
      # carries wiki markup. Runs even if a prior step failed, and the report is
      # always uploaded.
      - name: Audit deck health
        if: always()
        run: python docs/cards_audit.py

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cards-audit-report
          path: cards_audit_report.md
          if-no-files-found: warn

  # ⚠️ СЛАВА — ОТДЕЛЬНЫМ JOB'ОМ, И ЭТО НЕ КОСМЕТИКА. Она стояла последним
  # шагом внутри enrich и не выполнилась ВООБЩЕ: job упёрся в потолок в 330
  # минут, а `if: always()` от таймаута job'а не спасает — он про упавшие
  # шаги, не про убитый job. Слава при этом перцентиль: шаги выше двигают
  # шкалу, из которой она считается, и несчитанная слава — это устаревшие
  # тир карточки и метка «легенда» у всей колоды.
  #
  # `needs` + `if: always()` означает «после enrich, чем бы тот ни кончился».
  fame:
    runs-on: ubuntu-latest
    needs: enrich
    if: always()
    timeout-minutes: 30
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: football_scraper/requirements.txt
      - name: Install deps
        run: pip install -r football_scraper/requirements.txt
      - name: Refresh card fame (percentile over pageviews)
        run: python docs/cards_fame_refresh.py
