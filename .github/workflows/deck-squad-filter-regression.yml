name: deck-squad-filter-regression

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sql-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sherlock_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sherlock_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: sherlock_test
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
      - name: Prepare isolated squad filter schema
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/deck_squad_filters_test_setup.sql
      - name: Apply squad filter RPC
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261026180000_deck_squad_filters.sql
      - name: Verify league filtering and minimum squad size
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/deck_squad_filters.test.sql
