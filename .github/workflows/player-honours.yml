name: player-honours

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/player-honours.yml'
      - 'docs/cards_honours_build.py'
      - 'docs/test_cards_honours_build.py'
  pull_request:
    paths:
      - '.github/workflows/player-honours.yml'
      - 'docs/cards_honours_build.py'
      - 'docs/test_cards_honours_build.py'
      - 'src/shared/lib/honours.ts'
      - 'src/shared/lib/honours.test.ts'
      - 'src/shared/types/database.ts'
      - 'src/screens/collection/CardDossier.tsx'
  schedule:
    - cron: '20 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install scraper dependencies
        run: pip install -r football_scraper/requirements.txt

      - name: Test honours parser
        run: python docs/test_cards_honours_build.py

      - name: Compile honours sync
        run: python -m py_compile docs/cards_honours_build.py


  sync:
    if: github.event_name != 'pull_request'
    needs: [validate]
    concurrency:
      group: player-honours-sync
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      APPLY: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: football_scraper/requirements.txt

      - name: Install scraper dependencies
        run: pip install -r football_scraper/requirements.txt

      - name: Verify production secrets are present
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_URL" || { echo "::error::SUPABASE_URL is missing"; exit 1; }
          test -n "$SUPABASE_KEY" || { echo "::error::SUPABASE_KEY is missing"; exit 1; }

      - name: Refresh the highest-fame player cards
        run: python docs/cards_honours_build.py --limit 800 --apply

      - name: Calculate rolling catalogue window
        id: window
        shell: bash
        run: |
          set -euo pipefail
          headers="$RUNNER_TEMP/cards-count-headers.txt"
          curl -fsS -D "$headers" -o /dev/null \
            "$SUPABASE_URL/rest/v1/cards?select=id&category=in.%28player%2Cwoman%29&active=eq.true&limit=1" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            -H "Prefer: count=exact" \
            -H "Range: 0-0"
          count=$(awk 'BEGIN { IGNORECASE=1 } /^content-range:/ { gsub("\r", ""); split($2, a, "/"); print a[2] }' "$headers" | tail -n 1)
          case "$count" in
            ''|*[!0-9]*) echo "::error::Could not read active player-card count"; exit 1 ;;
          esac
          if [ "$count" -le 800 ]; then
            offset=0
          elif [ "$count" -le 1600 ]; then
            offset=800
          else
            windows=$(((count - 800 + 799) / 800))
            offset=$((800 + ((GITHUB_RUN_NUMBER - 1) % windows) * 800))
          fi
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "offset=$offset" >> "$GITHUB_OUTPUT"
          echo "Active player cards: $count; rolling window starts at offset $offset"

      - name: Refresh the rolling player-card catalogue window
        if: steps.window.outputs.count > 800
        run: python docs/cards_honours_build.py --limit 800 --offset "${{ steps.window.outputs.offset }}" --apply

      - name: Report sync completion
        if: always()
        run: |
          echo "Player honours sync finished. Check the preceding step summaries for processed, changed, unchanged, missing-source and failed counts."
  watch:
    needs: [validate, sync]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      VALIDATE_RESULT: ${{ needs.validate.result }}
      SYNC_RESULT: ${{ needs.sync.result }}
      SYNC_EXPECTED: ${{ github.event_name != 'pull_request' }}
    steps:
      - name: Verify honours pipeline completed
        shell: bash
        run: |
          set -euo pipefail
          echo "validate = $VALIDATE_RESULT"
          echo "sync = $SYNC_RESULT (expected=$SYNC_EXPECTED)"
          [ "$VALIDATE_RESULT" = "success" ] || { echo "::error::validation: $VALIDATE_RESULT"; exit 1; }
          if [ "$SYNC_EXPECTED" = "true" ]; then
            [ "$SYNC_RESULT" = "success" ] || { echo "::error::production sync: $SYNC_RESULT"; exit 1; }
          else
            [ "$SYNC_RESULT" = "skipped" ] || { echo "::error::sync should be skipped on pull requests, got $SYNC_RESULT"; exit 1; }
          fi
