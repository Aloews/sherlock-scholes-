name: Sync Sherlock provider credentials to Railway reviewer

on:
  push:
    branches:
      - feat/sherlock-multi-agent-runtime-20261113
    paths:
      - .github/workflows/sync-agent-secrets.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sherlock-provider-secret-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RAILWAY: ${{ secrets.RAILWAY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      RAILWAY_PROJECT_ID: "0da4e454-1ef6-4b90-8424-141e8dfbcd02"
      RAILWAY_ENVIRONMENT_ID: "d880b6be-d0a8-417b-b850-5e13f3237c3d"
      RAILWAY_REVIEWER_SERVICE_ID: "b7ec76a3-8442-462e-b2f3-85fb5159db08"
    steps:
      - name: Install Railway CLI
        run: npm install --global --allow-scripts=@railway/cli @railway/cli

      - name: Verify secrets and Railway access
        shell: bash
        run: |
          set -euo pipefail
          for name in RAILWAY CLOUDFLARE_API_TOKEN FLY_API_TOKEN NEON_API_KEY RENDER_API_KEY SUPABASE_ACCESS_TOKEN; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing GitHub Actions secret mapped to ${name}"
              exit 1
            fi
          done
          if RAILWAY_API_TOKEN="$RAILWAY" railway whoami >/dev/null 2>&1; then
            export RAILWAY_API_TOKEN="$RAILWAY"
          else
            export RAILWAY_TOKEN="$RAILWAY"
          fi
          railway whoami

      - name: Link the existing Sherlock project
        run: |
          set -euo pipefail
          railway link \
            --project "$RAILWAY_PROJECT_ID" \
            --environment "$RAILWAY_ENVIRONMENT_ID" \
            --service "$RAILWAY_REVIEWER_SERVICE_ID" \
            --json

      - name: Transfer provider credentials without printing values
        shell: bash
        run: |
          set -euo pipefail
          set_secret() {
            local name="$1"
            local value="$2"
            printf '%s' "$value" | railway variable set "$name" \
              --stdin --skip-deploys \
              --service "$RAILWAY_REVIEWER_SERVICE_ID" \
              --environment "$RAILWAY_ENVIRONMENT_ID"
          }
          set_secret CLOUDFLARE_API_TOKEN "$CLOUDFLARE_API_TOKEN"
          set_secret FLY_API_TOKEN "$FLY_API_TOKEN"
          set_secret NEON_API_KEY "$NEON_API_KEY"
          set_secret RENDER_API_KEY "$RENDER_API_KEY"
          set_secret SUPABASE_ACCESS_TOKEN "$SUPABASE_ACCESS_TOKEN"
          set_secret RAILWAY_API_TOKEN "$RAILWAY_API_TOKEN"

      - name: Redeploy only the reviewer service
        run: |
          set -euo pipefail
          railway service redeploy \
            --service "$RAILWAY_REVIEWER_SERVICE_ID" \
            --environment "$RAILWAY_ENVIRONMENT_ID" \
            --yes
