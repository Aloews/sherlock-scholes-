name: player-profile-data

on:
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch:
    inputs:
      transfermarkt_id:
        description: 'Optional Transfermarkt ID for one-player backfill'
        required: false
        type: string
        default: ''
      limit:
        description: 'Maximum players processed in a scheduled/batch run'
        required: false
        type: string
        default: '600'

concurrency:
  group: player-profile-data
  cancel-in-progress: false

jobs:
  season-stats:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      TM_ID: ${{ inputs.transfermarkt_id }}
      PLAYER_LIMIT: ${{ inputs.limit }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: football_scraper/requirements.txt

      - name: Install dependencies
        run: pip install -r football_scraper/requirements.txt

      - name: Test seasonal-stat candidate selection
        run: python3 docs/test_players_stats_transfermarkt.py

      - name: Collect seasonal player statistics
        run: |
          if [ -n "$TM_ID" ]; then
            APPLY=1 python3 docs/players_stats_transfermarkt.py --only "$TM_ID"
          else
            limit="${PLAYER_LIMIT:-600}"
            case "$limit" in
              ''|*[!0-9]*) echo "::error::PLAYER_LIMIT must be a positive integer"; exit 2 ;;
            esac
            if [ "$limit" -lt 1 ]; then echo "::error::PLAYER_LIMIT must be positive"; exit 2; fi
            APPLY=1 python3 docs/players_stats_transfermarkt.py --min-value 0 --include-unvalued --limit "$limit"
          fi

  player-photos:
    if: ${{ github.event_name == 'schedule' || inputs.transfermarkt_id == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: football_scraper/requirements.txt

      - name: Install dependencies
        run: pip install -r football_scraper/requirements.txt

      - name: Backfill player portraits by Wikidata entity ID
        run: APPLY=1 python3 docs/cards_photo_from_qid.py

      - name: Collect required Wikimedia photo credits
        if: always()
        run: APPLY=1 python3 docs/cards_photo_credits.py --minutes 12
