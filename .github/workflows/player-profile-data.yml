name: player-profile-data

on:
  push:
    branches: [main]
    paths:
      - 'docs/players_stats_transfermarkt.py'
      - 'docs/test_players_stats_transfermarkt.py'
      - 'docs/cards_photo_from_qid.py'
      - 'docs/cards_photo_transfermarkt.py'
      - 'docs/cards_photo_credits.py'
      - 'docs/profile_backfill_queue.py'
      - 'docs/soccerwiki_link_refresh.py'
      - 'docs/soccerwiki_players.py'
      - 'football_scraper/tests/test_soccerwiki_player.py'
      - 'docs/test_profile_backfill_queue.py'
      - 'docs/test_soccerwiki_link_refresh.py'
      - 'docs/test_cards_photo_transfermarkt.py'
      - 'supabase/migrations/**'
  schedule:
    - cron: '0 11 * * *'
    - cron: '0 3,19 * * *'
  workflow_dispatch:
    inputs:
      transfermarkt_id:
        description: 'Optional Transfermarkt ID for one-player backfill'
        required: false
        type: string
        default: ''
      limit:
        description: 'Maximum players processed in a scheduled/batch run'
        required: false
        type: string
        default: '1200'

concurrency:
  group: player-profile-data
  cancel-in-progress: false

jobs:
  season-stats:
    if: ${{ github.event_name != 'schedule' || github.event.schedule == '0 11 * * *' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      TM_ID: ${{ inputs.transfermarkt_id }}
      PLAYER_LIMIT: ${{ inputs.limit }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: football_scraper/requirements.txt

      - name: Install dependencies
        run: pip install -r football_scraper/requirements.txt

      - name: Test seasonal-stat candidate selection
        run: python3 docs/test_players_stats_transfermarkt.py

      - name: Prioritize reported missing player profile
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.transfermarkt_id == '' }}
        run: APPLY=1 python3 docs/players_stats_transfermarkt.py --only 236590 --refresh

      - name: Refresh Martin Odegaard seasonal statistics
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.transfermarkt_id == '' }}
        run: APPLY=1 python3 docs/players_stats_transfermarkt.py --only 316264 --refresh

      - name: Refresh Harry Kane seasonal statistics
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.transfermarkt_id == '' }}
        run: APPLY=1 python3 docs/players_stats_transfermarkt.py --only 132098 --refresh

      - name: Collect seasonal player statistics
        id: stats_batch
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.transfermarkt_id == '' }}
        run: |
          echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          if [ -n "$TM_ID" ]; then
            APPLY=1 python3 docs/players_stats_transfermarkt.py --only "$TM_ID" --refresh
          else
            limit="${PLAYER_LIMIT:-1200}"
            case "$limit" in
              ''|*[!0-9]*) echo "::error::PLAYER_LIMIT must be a positive integer"; exit 2 ;;
            esac
            if [ "$limit" -lt 1 ]; then echo "::error::PLAYER_LIMIT must be positive"; exit 2; fi
            APPLY=1 python3 docs/players_stats_transfermarkt.py --min-value 0 --include-unvalued --refresh --limit "$limit"
          fi

      - name: Verify priority players have current club-season statistics
        if: always() && (github.event_name != 'workflow_dispatch' || inputs.transfermarkt_id == '')
        run: |
          set -euo pipefail
          while read -r id competition club; do
            rows=$(curl -fsS --get \
              --data-urlencode "select=tm_player_id,season_id,competition_id,club_id,apps,minutes,goals,assists,fetched_at" \
              --data-urlencode "tm_player_id=eq.$id" \
              --data-urlencode "season_id=eq.2026" \
              --data-urlencode "competition_id=eq.$competition" \
              --data-urlencode "club_id=eq.$club" \
              --data-urlencode "order=fetched_at.desc" \
              --data-urlencode "limit=1" \
              "$SUPABASE_URL/rest/v1/player_season_stat" \
              -H "apikey: $SUPABASE_KEY" \
              -H "Authorization: Bearer $SUPABASE_KEY")
            if echo "$rows" | jq -e 'length > 0' >/dev/null; then
              echo "Transfermarkt ID $id has a verified 2026/27 club-season row ($competition / $club)"
              echo "$rows" | jq .
              continue
            fi
            echo "::error::Transfermarkt ID $id is missing its 2026/27 club-season row ($competition / $club)"
            exit 1
          done <<'PLAYERS'
          316264 GB1 11
          132098 L1 27
          PLAYERS
      - name: Verify the targeted player's season statistics were stored
        if: always()
        env:
          VERIFY_TM_ID: ${{ inputs.transfermarkt_id }}
        run: |
          id="${VERIFY_TM_ID:-236590}"
          case "$id" in
            ''|*[!0-9]*) echo "::error::Invalid Transfermarkt ID for verification"; exit 2 ;;
          esac
          count=$(curl -fsS --get \
            --data-urlencode "select=tm_player_id" \
            --data-urlencode "tm_player_id=eq.$id" \
            "$SUPABASE_URL/rest/v1/player_season_stat" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" | jq 'length')
          if [ "$count" -lt 1 ]; then
            echo "::error::No player_season_stat rows were stored for Transfermarkt ID $id"
            exit 1
          fi
          echo "Verified $count season-stat rows for Transfermarkt ID $id"

      - name: Verify full stats batch advanced production checkpoints
        if: ${{ steps.stats_batch.outcome == 'success' && (github.event_name != 'workflow_dispatch' || inputs.transfermarkt_id == '') }}
        env:
          BATCH_STARTED_AT: ${{ steps.stats_batch.outputs.started_at }}
        run: |
          count_since() {
            column="$1"
            curl -fsS --get \
              --data-urlencode "select=id" \
              --data-urlencode "category=in.(player,woman)" \
              --data-urlencode "active=eq.true" \
              --data-urlencode "$column=gte.$BATCH_STARTED_AT" \
              --data-urlencode "limit=1000" \
              "$SUPABASE_URL/rest/v1/cards" \
              -H "apikey: $SUPABASE_KEY" \
              -H "Authorization: Bearer $SUPABASE_KEY" | jq 'length'
          }
          attempts="$(count_since player_stats_checked_at)"
          synced="$(count_since player_stats_data_synced_at)"
          echo "Player stats attempts written during batch: $attempts"
          echo "Verified player snapshots written during batch: $synced"
          [ "$attempts" -ge 600 ] || {
            echo "::error::Expected at least 600 player refresh attempts; found $attempts"
            exit 1
          }
          [ "$synced" -ge 500 ] || {
            echo "::error::Expected at least 500 verified player snapshots; found $synced"
            exit 1
          }

  player-photos:
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.transfermarkt_id == '') }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: football_scraper/requirements.txt

      - name: Install dependencies
        run: pip install -r football_scraper/requirements.txt

      - name: Test Transfermarkt portrait parser and candidate rotation
        run: python3 docs/test_cards_photo_transfermarkt.py

      - name: Test profile backfill queue and source identity checks
        run: python3 docs/test_profile_backfill_queue.py

      - name: Test verified-only Soccer Wiki photo writes
        run: python3 docs/test_soccerwiki_link_refresh.py

      - name: Refresh Soccer Wiki player-to-card links and ratings
        run: python3 docs/soccerwiki_link_refresh.py --skip-photo-fill

      - name: Test Soccer Wiki player detail parser
        run: python3 football_scraper/tests/test_soccerwiki_player.py

      - name: Collect Soccer Wiki player detail photos
        run: APPLY=1 python3 docs/soccerwiki_players.py --minutes 90 --linked-first --refresh --offset "$((GITHUB_RUN_NUMBER * 5000))"

      - name: Enqueue and process verified player-photo backfill
        run: |
          APPLY=1 python3 docs/profile_backfill_queue.py \
            --enqueue-limit 1000 \
            --batch-size 10 \
            --max-jobs 500 \
            --report "$RUNNER_TEMP/profile-backfill-result.jsonl"

      - name: Upload backfill audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: profile-backfill-result-${{ github.run_id }}
          path: ${{ runner.temp }}/profile-backfill-result.jsonl
          if-no-files-found: warn
          retention-days: 30

      - name: Collect required Wikimedia photo credits
        if: always()
        run: APPLY=1 python3 docs/cards_photo_credits.py --minutes 12

  watch:
    runs-on: ubuntu-latest
    needs: [season-stats, player-photos]
    if: always()
    timeout-minutes: 5
    env:
      STATS_RESULT: ${{ needs.season-stats.result }}
      STATS_EXPECTED: ${{ github.event_name != 'schedule' || github.event.schedule == '0 11 * * *' }}
      PHOTOS_RESULT: ${{ needs.player-photos.result }}
      PHOTOS_EXPECTED: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.transfermarkt_id == '') }}
    steps:
      - name: Verify profile-data jobs completed
        run: |
          echo "season-stats = $STATS_RESULT"
          echo "player-photos = $PHOTOS_RESULT (expected=$PHOTOS_EXPECTED)"
          if [ "$STATS_EXPECTED" = "true" ]; then
            [ "$STATS_RESULT" = "success" ] || { echo "::error::season-stats: $STATS_RESULT"; exit 1; }
          else
            [ "$STATS_RESULT" = "skipped" ] || { echo "::error::season-stats should be skipped for a photo-only schedule, got $STATS_RESULT"; exit 1; }
          fi
          if [ "$PHOTOS_EXPECTED" = "true" ]; then
            [ "$PHOTOS_RESULT" = "success" ] || { echo "::error::player-photos: $PHOTOS_RESULT"; exit 1; }
          else
            [ "$PHOTOS_RESULT" = "skipped" ] || { echo "::error::player-photos should be skipped for a one-player run, got $PHOTOS_RESULT"; exit 1; }
          fi
