name: espn-results-refresh

# Independent match-result refresh. Team-tournament forecasts depend on club_match,
# which is rebuilt from player_match_stats; do not make it wait for the slower
# 1,200-profile sports.ru crawl.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/espn-results-refresh.yml'
      - 'football_scraper/espn_stats.py'
      - 'football_scraper/scraper/espn.py'
      - 'football_scraper/tests/test_espn.py'
      - 'football_scraper/tests/test_espn_stats.py'
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      days:
        description: 'How many recent days to refresh'
        required: false
        type: string
        default: '2'

permissions:
  contents: read

concurrency:
  group: espn-results-refresh
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: football_scraper/requirements.txt
      - name: Install dependencies
        run: pip install -r football_scraper/requirements.txt
      - name: Test ESPN match and player-stat parsers
        working-directory: football_scraper
        run: |
          python3 tests/test_espn.py
          python3 tests/test_espn_stats.py

  collect:
    needs: [validate]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      DAYS: ${{ inputs.days }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: football_scraper/requirements.txt
      - name: Install dependencies
        run: pip install -r football_scraper/requirements.txt
      - name: Verify production target
        run: |
          test -n "$SUPABASE_URL" || { echo "::error::SUPABASE_URL is missing"; exit 1; }
          test -n "$SUPABASE_KEY" || { echo "::error::SUPABASE_KEY is missing"; exit 1; }
          host="$(python -c 'import os, urllib.parse; print(urllib.parse.urlparse(os.environ["SUPABASE_URL"]).hostname or "")')"
          [ "$host" = "konoavrduynecxblqfvq.supabase.co" ] || {
            echo "::error::SUPABASE_URL does not target production"
            exit 1
          }
      - name: Refresh recent ESPN match results
        working-directory: football_scraper
        run: |
          days="${DAYS:-2}"
          case "$days" in
            ''|*[!0-9]*) echo "::error::DAYS must be a positive integer"; exit 2 ;;
          esac
          [ "$days" -ge 1 ] && [ "$days" -le 14 ] || {
            echo "::error::DAYS must be between 1 and 14"; exit 2
          }
          python3 espn_stats.py --days "$days"
      - name: Rebuild team matches and refresh dependent caches
        if: success()
        run: |
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          for fn in rebuild_club_matches refresh_stats_planner refresh_player_rating_cache; do
            code=$(curl -sS -X POST "$SUPABASE_URL/rest/v1/rpc/$fn" \
              -H "apikey: $SUPABASE_KEY" \
              -H "Authorization: Bearer $SUPABASE_KEY" \
              -H "Content-Type: application/json" -d '{}' \
              -o "$response_file" -w '%{http_code}')
            if [ "$code" != "200" ]; then
              echo "::error::$fn returned HTTP $code"
              cat "$response_file"
              exit 1
            fi
            echo "$fn: HTTP $code"
          done

  watch:
    runs-on: ubuntu-latest
    needs: [validate, collect]
    if: always()
    timeout-minutes: 5
    env:
      VALIDATE_RESULT: ${{ needs.validate.result }}
      COLLECT_RESULT: ${{ needs.collect.result }}
    steps:
      - name: Verify ESPN refresh completed
        run: |
          echo "validate = $VALIDATE_RESULT"
          echo "collect = $COLLECT_RESULT"
          [ "$VALIDATE_RESULT" = "success" ] || {
            echo "::error::ESPN validation: $VALIDATE_RESULT"; exit 1;
          }
          [ "$COLLECT_RESULT" = "success" ] || {
            echo "::error::ESPN result refresh: $COLLECT_RESULT"; exit 1;
          }
