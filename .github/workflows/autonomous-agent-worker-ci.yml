name: autonomous-agent-worker-ci

on:
  pull_request:
    paths:
      - "services/autonomous-agent/**"
      - ".github/workflows/autonomous-agent-worker-ci.yml"
  push:
    branches:
      - "**"
    paths:
      - "services/autonomous-agent/**"
      - ".github/workflows/autonomous-agent-worker-ci.yml"

permissions:
  contents: read

concurrency:
  group: autonomous-agent-worker-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  worker-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile worker and tests
        run: python -m py_compile services/autonomous-agent/worker.py services/autonomous-agent/test_worker.py
      - name: Run offline worker policy and recovery tests
        working-directory: services/autonomous-agent
        run: python -m unittest -v
      - name: Check patch whitespace
        run: git diff --check
