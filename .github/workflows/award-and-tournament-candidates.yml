name: award-and-tournament-candidates

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/award-and-tournament-candidates.yml'
      - '.github/workflows/player-profile-data.yml'
      - '.github/workflows/espn-results-refresh.yml'
      - '.github/workflows/player-stats.yml'
      - 'docs/award_candidates_build.py'
      - 'docs/test_award_candidates_build.py'
      - 'supabase/migrations/20261027143304_award_tournament_candidate_pipeline.sql'
      - 'supabase/migrations/20261027160500_team_candidate_rpc_overview.sql'
      - 'supabase/migrations/20261027190000_active_team_candidate_snapshot.sql'
      - 'supabase/migrations/20261027191500_latest_award_candidate_season.sql'
  pull_request:
    paths:
      - '.github/workflows/award-and-tournament-candidates.yml'
      - '.github/workflows/player-market-value-refresh.yml'
      - '.github/workflows/player-profile-data.yml'
      - '.github/workflows/espn-results-refresh.yml'
      - '.github/workflows/player-stats.yml'
      - 'docs/award_candidates_build.py'
      - 'docs/test_award_candidates_build.py'
      - 'docs/players_stats_transfermarkt.py'
      - 'docs/test_players_stats_transfermarkt.py'
      - 'docs/players_market_value_transfermarkt.py'
      - 'docs/test_players_market_value_transfermarkt.py'
      - 'supabase/migrations/20261027143304_award_tournament_candidate_pipeline.sql'
      - 'supabase/migrations/20261027160500_team_candidate_rpc_overview.sql'
      - 'supabase/migrations/20261027190000_active_team_candidate_snapshot.sql'
      - 'supabase/migrations/20261027191500_latest_award_candidate_season.sql'
  workflow_run:
    workflows: ["player-profile-data", "player-market-value-refresh", "espn-results-refresh", "player-stats"]
    types: [completed]
  workflow_dispatch:
    inputs:
      persist_calibration:
        description: "Persist calibrated probabilities after the provenance/calibration migration has been applied"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: award-and-tournament-candidates
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install scraper dependencies
        run: pip install -r football_scraper/requirements.txt
      - name: Test candidate ranking
        run: python docs/test_award_candidates_build.py
      - name: Test current-season refresh priority
        run: python docs/test_players_stats_transfermarkt.py
      - name: Test source-date guard and market-value refresh rotation
        run: python docs/test_players_market_value_transfermarkt.py
      - name: Test market-value source provenance
        run: python docs/test_market_value_provenance.py
      - name: Test walk-forward forecast calibration
        run: python docs/test_forecast_calibration.py
      - name: Compile candidate and calibration pipelines
        run: python -m py_compile docs/award_candidates_build.py docs/forecast_calibration.py

  refresh:
    if: github.event_name != 'pull_request' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.name == 'espn-results-refresh')
    needs: [validate]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: football_scraper/requirements.txt
      - name: Install scraper dependencies
        run: pip install -r football_scraper/requirements.txt
      - name: Verify production secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_URL" || { echo "::error::SUPABASE_URL is missing"; exit 1; }
          test -n "$SUPABASE_KEY" || { echo "::error::SUPABASE_KEY is missing"; exit 1; }
      - name: Build and store candidate snapshots
        env:
          EVENT_NAME: ${{ github.event_name }}
          UPSTREAM_WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          UPSTREAM_WORKFLOW_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          # A failed ESPN rebuild may still have refreshed individual-player stats.
          # Keep personal-award updates, but never publish team candidates from a stale fixture feed.
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            python docs/award_candidates_build.py
          elif [ "$EVENT_NAME" = "workflow_run" ] && [ "$UPSTREAM_WORKFLOW_NAME" = "espn-results-refresh" ]; then
            if [ "$UPSTREAM_WORKFLOW_CONCLUSION" = "success" ]; then
              python docs/award_candidates_build.py
            else
              python docs/award_candidates_build.py --skip-team-candidates
            fi
          elif [ "$EVENT_NAME" = "workflow_run" ] && [ "$UPSTREAM_WORKFLOW_NAME" = "player-stats" ]; then
            python docs/award_candidates_build.py
          else
            python docs/award_candidates_build.py --skip-team-candidates
          fi
      - name: Produce leakage-safe calibration report
        run: python docs/forecast_calibration.py --output forecast-calibration-report.json
      - name: Persist calibrated probabilities and evaluation ledger
        if: github.event_name == 'workflow_dispatch' && inputs.persist_calibration == true
        run: python docs/forecast_calibration.py --persist --output forecast-calibration-report.json
      - name: Upload calibration report
        if: always() && hashFiles('forecast-calibration-report.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: forecast-calibration-report
          path: forecast-calibration-report.json
          if-no-files-found: error
          retention-days: 90

  watch:
    needs: [validate, refresh]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      VALIDATE_RESULT: ${{ needs.validate.result }}
      REFRESH_RESULT: ${{ needs.refresh.result }}
      REFRESH_EXPECTED: ${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.name == 'espn-results-refresh') }}
    steps:
      - name: Verify candidate pipeline completed
        shell: bash
        run: |
          set -euo pipefail
          echo "validate = $VALIDATE_RESULT"
          echo "refresh = $REFRESH_RESULT (expected=$REFRESH_EXPECTED)"
          [ "$VALIDATE_RESULT" = "success" ] || { echo "::error::validation: $VALIDATE_RESULT"; exit 1; }
          if [ "$REFRESH_EXPECTED" = "true" ]; then
            [ "$REFRESH_RESULT" = "success" ] || { echo "::error::production refresh: $REFRESH_RESULT"; exit 1; }
          else
            [ "$REFRESH_RESULT" = "skipped" ] || { echo "::error::refresh should be skipped on pull requests, got $REFRESH_RESULT"; exit 1; }
          fi
