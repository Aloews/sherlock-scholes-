<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0A0E1A" />
    <!-- ⚠️ ПРАВА НА СОБРАННЫЙ МАТЕРИАЛ — МАШИНОЧИТАЕМО, С ПЕРВОЙ СТРАНИЦЫ.
         Часть контента взята из открытых источников (Википедия, Викисклад,
         Викиданные) под лицензиями, которые требуют назвать источник. Экран
         «Источники и права» делает это для человека; эти две строки — для
         всех остальных: разбора, краулера, чужого юриста. Разбор целиком:
         docs/CONTENT_RIGHTS.md -->
    <link rel="license" href="/sources" />
    <meta
      name="rights"
      content="Часть материалов собрана из открытых источников; список источников и их лицензии — /sources"
    />
    <title>Шерлок Скоулс</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- ⚠️ ШРИФТЫ НЕ БЛОКИРУЮТ ОТРИСОВКУ. Обычный <link rel="stylesheet"> —
         render-blocking: браузер не рисует НИЧЕГО, пока не сходит на
         fonts.googleapis.com, а оттуда на fonts.gstatic.com. Это два внешних
         домена с DNS, TLS и запросом на каждом — до первого пикселя, на
         телефоне и мобильной сети.

         `media="print"` снимает блокировку (для экрана стиль не нужен), а
         onload возвращает его в дело. В URL уже стоит `display=swap`, так что
         текст рисуется запасным шрифтом и подменяется, когда приедет Inter, —
         вместо того чтобы не рисоваться вовсе. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Playfair+Display:wght@500;600;700;800;900&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript
      ><link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Playfair+Display:wght@500;600;700;800;900&display=swap"
        rel="stylesheet"
    /></noscript>
    <script>
      // Design system (see src/shared/design/designs.ts) — read the persisted
      // setting and put it on <html> BEFORE first paint, so a player on the
      // non-default design never sees the other one flash. React re-applies
      // the same value on mount; this is only about paint order.
      // ⚠️ СПИСОК ДИЗАЙНОВ ЗДЕСЬ ОБЯЗАН СОВПАДАТЬ С DESIGN_IDS. Раньше он был
      // выписан как `saved === 'classic' || saved === 'master'`, и третий
      // дизайн такая проверка молча отбрасывала бы: человек, выбравший
      // бумагу, видел бы тёмный экран на КАЖДОЙ загрузке до монтирования
      // React, а потом мигание в светлый. Проверяется
      // test/design_preload.test.ts — вписанный список против DESIGN_IDS.
      (function () {
        var fallback = 'master';
        var known = ['master', 'classic', 'paper'];
        try {
          var raw = localStorage.getItem('sherlock_settings');
          var saved = raw && JSON.parse(raw).state.design;
          var use = known.indexOf(saved) >= 0 ? saved : fallback;
          document.documentElement.dataset.design = use;
          // Хром телеграма красится до первого кадра: иначе рамка вокруг
          // светлого приложения секунду остаётся тёмной.
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta && use === 'paper') meta.content = '#F2EADB';
        } catch (e) {
          document.documentElement.dataset.design = fallback;
        }
      })();
    </script>
    <!-- ⚠️ ЦВЕТА ОБОЛОЧКИ, И ОНИ В <head> НАМЕРЕННО. Фон body и мяч заставки
         рисуются ДО единой строчки JS и до внешнего CSS: токены из index.css
         им недоступны, а стиль, объявленный ниже по документу, может не
         успеть к первому кадру. Без этих двух строк человек с бумажным
         дизайном видел бы тёмный экран с белым мячом, а потом вспышку в
         кремовый.

         ⚠️ И ИМЕННО ВСТРОЕННЫЙ ФОН BODY ДЕРЖАЛ СТРАНИЦУ ТЁМНОЙ. `bg-brand-bg`
         рядом уже читал токен и давал кремовый, но `style="background:
         #0a0e1a"` перебивал его по правилам каскада. Замер computed-стиля в
         настоящем браузере: --brand-bg = 242 234 219, а body = rgb(10,14,26).

         Значения повторяют --brand-bg и --brand-fg блока 'paper'; расходиться
         им нельзя — сверяет test/design_paper.test.ts. -->
    <style>
      html[data-design='paper'] {
        --splash-bg: #f2eadb;
        --splash-ink: #1e1b16;
      }
    </style>
  </head>
    <!-- ⚠️ ВСТРОЕННЫЙ ФОН ПЕРЕБИВАЕТ ЛЮБОЙ КЛАСС, И ИМЕННО ОН ДЕРЖАЛ
         СТРАНИЦУ ТЁМНОЙ. `bg-brand-bg` рядом уже читал токен и давал
         кремовый, а `style="background: #0a0e1a"` побеждал его по правилам
         каскада: браузер показывал тёмный фон с чернильным текстом.
         Нашлось это не глазами, а замером computed-стиля в настоящем
         браузере: `--brand-bg` = 242 234 219, а `body` = rgb(10,14,26).
         Переменная та же, что у заставки, и объявлена там же. -->
  <body class="bg-brand-bg text-white" style="background: var(--splash-bg, #0a0e1a); margin: 0">
    <!-- ⚠️ ОБОЛОЧКА РИСУЕТСЯ ДО ЕДИНОЙ СТРОЧКИ JS, И РАДИ ЭТОГО ОНА ЗДЕСЬ.
         Замер медленного 4G (1.6 Мбит/с, RTT 150 мс, процессор ×4): первый
         кадр наступал через 1972 мс. Всё это время `#root` был пуст —
         браузеру нужно скачать 225 КБ сжатого JS, разобрать его, дождаться
         локали отдельным запросом (см. main.tsx) и только потом React
         рисовал свой экран загрузки. Экран загрузки в приложении есть, он
         просто приезжал последним.

         Это тот же приём, которым живёт ТВ (Aloews/sherlock-tv): показать
         что-то сразу, остальное догрузить молча.

         Мяч ТОТ ЖЕ, что у LazyFallback в src/app/Router.tsx, и анимация та же
         (1.2 с, вверх на 6 пикселей) — чтобы в момент, когда React заменит
         оболочку своим экраном, ничего не дёрнулось. Правите там — правьте и
         здесь; двух источников у этой картинки нет, но есть две копии, и это
         сознательная цена за отрисовку без JS.

         React стирает содержимое #root при монтировании, убирать вручную
         нечего. Стили инлайновые: файл CSS тоже блокирующий и приезжает
         позже. -->
    <div id="root">
      <div
        style="
          min-height: 100vh;
          display: flex;
          align-items: center;
          justify-content: center;
          background: var(--splash-bg, #0a0e1a);
        "
      >
        <svg viewBox="0 0 24 24" width="48" height="48" style="animation: ss-bounce 1.2s ease-in-out infinite">
          <circle cx="12" cy="12" r="10" fill="var(--splash-ink, #fff)" />
        </svg>
      </div>
    </div>
    <style>
      @keyframes ss-bounce {
        0%, 100% { transform: translateY(0); }
        50%      { transform: translateY(-6px); }
      }
      /* Мяч не прыгает у тех, кто просил не анимировать. Оболочка обязана
         уважать это ровно так же, как остальной интерфейс. */
      @media (prefers-reduced-motion: reduce) {
        svg { animation: none !important; }
      }
    </style>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
